# A request that only the cloud can build, in a build with no cloud configured (the CI build): Kalam must say so in
# words and keep what was typed. Nothing is built or saved (docs/07 §14, checklist D15-046). The real cloud build, an
# app built by Gemini on a phone, is .maestro/live/ai-built-app.yaml and needs a build with Firebase configured.
appId: com.kalam.app
name: Cloud-only request without a cloud
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Your shelf.*"
    timeout: 120000
- tapOn: "(Create|Make)"
# Make opens on the input tab used last (it is kept with the draft, so an earlier flow can leave Draw open): choose Type.
- extendedWaitUntil:
    visible: "Type"
    timeout: 30000
- tapOn: "Type"
- extendedWaitUntil:
    visible: "Describe the app you want to create.*"
    timeout: 30000
- tapOn: "Describe the app you want to create.*"
- inputText: "multi-role CRM with approvals and dashboards"
# iOS cannot hide the keyboard of a multi-line field (Return types a new line), so Maestro's hideKeyboard fails there.
# Tapping the plain heading above the field (in a ScrollView with keyboardShouldPersistTaps="handled") closes it on both.
- tapOn: "What should your app do\\?"
- tapOn:
    id: create-app
# Either the first-time question about sending to Gemini, or (already answered) the failure itself: no cloud set up,
# or, in a build with Firebase but no App Check token (CI, an emulator), "could not build this app yet" with the reason.
- extendedWaitUntil:
    visible: ".*(needs Gemini in the cloud|needs the cloud to build|could not build this app yet).*"
    timeout: 60000
- takeScreenshot: 22-cloud-needed
- runFlow:
    when:
      visible: ".*needs Gemini in the cloud.*"
    commands:
      - tapOn: "Send and build.*"
      - extendedWaitUntil:
          visible: ".*(cloud|set up|offline|available).*"
          timeout: 60000
- assertNotVisible: ".*Kalam understood.*"
- runFlow: ../common/pause.yaml
