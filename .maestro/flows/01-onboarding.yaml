# First run: the welcome screen, Continue, the empty App Shelf. Starts from a clean install.
appId: com.kalam.app
name: Onboarding
---
- launchApp:
    clearState: true

# A cold Release start on a CI machine can take a while (fonts and settings hold the splash).
- extendedWaitUntil:
    visible: "Draw the app.*"
    timeout: 120000
- takeScreenshot: 01-onboarding
- runFlow: ../common/pause.yaml
- scrollUntilVisible:
    element:
      id: onboarding-continue
    direction: DOWN
    timeout: 20000
- runFlow: ../common/pause.yaml
- tapOn:
    id: onboarding-continue

# Sign-in is required. The test account comes from -e KALAM_TEST_EMAIL and -e KALAM_TEST_PASSWORD (CI secrets).
- extendedWaitUntil:
    visible: "Sign in with email"
    timeout: 60000
- takeScreenshot: 01b-sign-in
- tapOn: "Email"
- inputText: ${KALAM_TEST_EMAIL}
- hideKeyboard
- tapOn: "Password"
- inputText: ${KALAM_TEST_PASSWORD}
- hideKeyboard
- tapOn: "Sign in with email"

- extendedWaitUntil:
    visible: "Your shelf.*"
    timeout: 30000
- takeScreenshot: 02-shelf-empty
- runFlow: ../common/pause.yaml
