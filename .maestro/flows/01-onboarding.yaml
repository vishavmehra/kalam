# First run: the welcome screen, Continue, the empty App Shelf. Starts from a clean install.
appId: com.kalam.app
name: Onboarding
---
- launchApp:
    clearState: true

# A busy CI emulator can put a system "isn't responding" box over the app. Choose Wait if one shows.
- runFlow:
    when:
      visible: ".*isn't responding.*"
    commands:
      - tapOn: "Wait"

# A cold Release start on a CI machine can take a while (fonts and settings hold the splash).
- extendedWaitUntil:
    visible: "Draw the app.*"
    timeout: 120000
- takeScreenshot: 01-onboarding
- runFlow: ../common/pause.yaml
- scrollUntilVisible:
    element:
      id: onboarding-continue
    direction: DOWN
    timeout: 20000
- runFlow: ../common/pause.yaml
- tapOn:
    id: onboarding-continue

# Sign-in is required. The test account comes from -e KALAM_TEST_EMAIL and -e KALAM_TEST_PASSWORD (CI secrets).
- extendedWaitUntil:
    visible: "Sign in with email"
    timeout: 60000
- takeScreenshot: 01b-sign-in
# Tap the fields by id: on iOS the text "Email" also matches the label above the field, which does not focus it.
- tapOn:
    id: auth-email
- inputText: ${KALAM_TEST_EMAIL}
# The iOS simulator can drop characters while Maestro types ("k.qa..." for "kalam.qa...", 2026-11-26): type the
# email again if it did not land whole.
- runFlow:
    when:
      notVisible: ${KALAM_TEST_EMAIL}
    commands:
      - tapOn:
          id: auth-email
      - eraseText: 80
      - inputText: ${KALAM_TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: auth-password
- inputText: ${KALAM_TEST_PASSWORD}
- hideKeyboard
- tapOn: "Sign in with email"
# The password is hidden, so a dropped character there only shows as "do not match": type both again, once.
- extendedWaitUntil:
    visible: "(Not now|That email and password do not match.*)"
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible: "That email and password do not match.*"
    commands:
      - tapOn:
          id: auth-email
      - eraseText: 80
      - inputText: ${KALAM_TEST_EMAIL}
      - hideKeyboard
      - tapOn:
          id: auth-password
      - eraseText: 80
      - inputText: ${KALAM_TEST_PASSWORD}
      - hideKeyboard
      - tapOn: "Sign in with email"

# After the first sign-in the app opens on Make and asks once about account sync. Say "Not now", then go to the shelf.
- extendedWaitUntil:
    visible: "Not now"
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
# Go to the shelf through the header seal at the top of the screen, not the Shelf tab: on iOS a field on Make can take
# focus as the sheet closes, the keyboard then covers the tab bar, and the Shelf tap hit the keyboard (2026-11-26).
- extendedWaitUntil:
    visible: "Kalam, go to your shelf"
    timeout: 30000
- tapOn: "Kalam, go to your shelf"

- extendedWaitUntil:
    visible: "Your shelf.*"
    timeout: 30000
- takeScreenshot: 02-shelf-empty
- runFlow: ../common/pause.yaml
