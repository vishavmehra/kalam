# Kalam Bazaar. It reads listings from Firestore, so on a CI machine it may show an error or empty state; the
# check is only that the tab opens.
appId: com.kalam.app
name: Bazaar
---
# Starts from a fresh launch, so a second run (the workflow reruns a failed flow once) begins in the same place.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Your shelf.*"
    timeout: 120000
- tapOn:
    text: "Bazaar"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Kalam Bazaar.*"
    timeout: 30000
- runFlow: ../common/pause.yaml
- takeScreenshot: 12-bazaar
- runFlow: ../common/pause.yaml
