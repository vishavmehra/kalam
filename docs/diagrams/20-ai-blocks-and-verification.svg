<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FAF7F2; background-color: #FAF7F2; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1455px" height="852px" viewBox="0 0 1455 852"><defs/><rect fill="#FAF7F2" width="100%" height="100%" x="0" y="0" style="fill: rgb(250, 247, 242);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="g1"><g transform="translate(0.5,0.5)"><rect x="25" y="96" width="1380" height="190" rx="5" ry="5" fill="#f3eee6" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(243, 238, 230); stroke: rgb(214, 211, 209);"/></g><g><g fill="#57534E" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="39" y="120">BUILD TIME: CHECKING AN AI STEP (the verifying stage, at most 30 seconds)</text></g></g></g><g data-cell-id="g2"><g transform="translate(0.5,0.5)"><rect x="25" y="326" width="1380" height="450" rx="5" ry="5" fill="#f3eee6" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(243, 238, 230); stroke: rgb(214, 211, 209);"/></g><g><g fill="#57534E" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="39" y="350">RUN TIME: USING AN AI STEP IN A SAVED APP</text></g></g></g><g data-cell-id="v1"><g transform="translate(0.5,0.5)"><rect x="45" y="138" width="250" height="130" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="170" y="164">Cheap checks first</text></g></g><g data-cell-id="v1_s"><g><rect x="45" y="165" width="250" height="101" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="170" y="181">No Nano, offline, cloud help off</text><text x="170" y="195">or a model still loading: an</text><text x="170" y="209">honest "not checked yet", with no</text><text x="170" y="223">model call.</text></g></g></g></g><g data-cell-id="v2"><g transform="translate(0.5,0.5)"><rect x="315" y="138" width="250" height="130" rx="4" ry="4" fill="#1c1917" stroke="#1c1917" pointer-events="all" style="fill: rgb(28, 25, 23); stroke: rgb(28, 25, 23);"/></g><g><g fill="#FAF7F2" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(250, 247, 242);"><text x="440" y="164">Cloud writes 5 test cases</text></g></g><g data-cell-id="v2_s"><g><rect x="315" y="165" width="250" height="101" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#D6D3D1" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(214, 211, 209);"><text x="440" y="181">One Firebase call per AI step.</text><text x="440" y="195">Photo steps wait for real sample</text><text x="440" y="209">photos.</text></g></g></g></g><g data-cell-id="v3"><g transform="translate(0.5,0.5)"><rect x="585" y="138" width="250" height="130" rx="4" ry="4" fill="#f2a541" stroke="#c77d0e" pointer-events="all" style="fill: rgb(242, 165, 65); stroke: rgb(199, 125, 14);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="710" y="164">Gemini Nano runs them</text></g></g><g data-cell-id="v3_s"><g><rect x="585" y="165" width="250" height="101" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#3B2A0A" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(59, 42, 10);"><text x="710" y="181">On this device, through the same</text><text x="710" y="195">orchestrator as every other AI</text><text x="710" y="209">task.</text></g></g></g></g><g data-cell-id="v4"><g transform="translate(0.5,0.5)"><rect x="855" y="138" width="250" height="130" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="980" y="164">Grade</text></g></g><g data-cell-id="v4_s"><g><rect x="855" y="165" width="250" height="101" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="980" y="181">Deterministic first. A cloud judge</text><text x="980" y="195">only for open-ended kinds:</text><text x="980" y="209">summarise and translate.</text></g></g></g></g><g data-cell-id="v5"><g><rect x="1125" y="138" width="250" height="130" rx="4" ry="4" fill="#fbe4dd" stroke="#e2583e" stroke-width="2" pointer-events="all" style="fill: rgb(251, 228, 221); stroke: rgb(226, 88, 62);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="1250" y="164">Record the result</text></g></g><g data-cell-id="v5_s"><g><rect x="1125" y="165" width="250" height="101" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="1250" y="181">A step is marked verified on</text><text x="1250" y="195">device only when its tests really</text><text x="1250" y="209">ran and passed. Otherwise it stays</text><text x="1250" y="223">unverified.</text></g></g></g></g><g data-cell-id="r1"><g transform="translate(0.5,0.5)"><rect x="45" y="368" width="300" height="150" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="195" y="394">The person taps a runAI button</text></g></g><g data-cell-id="r1_s"><g><rect x="45" y="395" width="300" height="121" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="195" y="411">extractFromPhoto, classify, summarise or</text><text x="195" y="425">translate. Each kind is one typed job with</text><text x="195" y="439">one schema.</text></g></g></g></g><g data-cell-id="r2"><g><rect x="375" y="368" width="300" height="150" rx="4" ry="4" fill="#fbe4dd" stroke="#e2583e" stroke-width="2" pointer-events="all" style="fill: rgb(251, 228, 221); stroke: rgb(226, 88, 62);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="525" y="394">Offline guard</text></g></g><g data-cell-id="r2_s"><g><rect x="375" y="395" width="300" height="121" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="525" y="411">A cloud-preferred step is refused offline</text><text x="525" y="425">before the photo picker opens. A step set</text><text x="525" y="439">to device only never needs the cloud.</text></g></g></g></g><g data-cell-id="r3"><g transform="translate(0.5,0.5)"><rect x="705" y="368" width="300" height="150" rx="4" ry="4" fill="#f2a541" stroke="#c77d0e" pointer-events="all" style="fill: rgb(242, 165, 65); stroke: rgb(199, 125, 14);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="855" y="394">Orchestrator</text></g></g><g data-cell-id="r3_s"><g><rect x="705" y="395" width="300" height="121" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#3B2A0A" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(59, 42, 10);"><text x="855" y="411">prefer_on_device. If the device fails, ONE</text><text x="855" y="425">Firebase cloud attempt, unless the step is</text><text x="855" y="439">device only. Reused answers come from the</text><text x="855" y="453">cache.</text></g></g></g></g><g data-cell-id="r4"><g transform="translate(0.5,0.5)"><rect x="1035" y="368" width="300" height="150" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="1185" y="394">Coerce and bound</text></g></g><g data-cell-id="r4_s"><g><rect x="1035" y="395" width="300" height="121" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="1185" y="411">Only the fields the step declares. Every</text><text x="1185" y="425">value is converted to its destination type</text><text x="1185" y="439">and limited before anything is shown.</text></g></g></g></g><g data-cell-id="r5"><g transform="translate(0.5,0.5)"><rect x="1035" y="578" width="300" height="150" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="1185" y="604">Proposal with its source</text></g></g><g data-cell-id="r5_s"><g><rect x="1035" y="605" width="300" height="121" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="1185" y="621">The answer appears with a badge: on</text><text x="1185" y="635">device, cloud or offline. Nothing is</text><text x="1185" y="649">written yet.</text></g></g></g></g><g data-cell-id="r6"><g><rect x="705" y="578" width="300" height="150" rx="4" ry="4" fill="#fbe4dd" stroke="#e2583e" stroke-width="2" pointer-events="all" style="fill: rgb(251, 228, 221); stroke: rgb(226, 88, 62);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="855" y="604">The person accepts</text></g></g><g data-cell-id="r6_s"><g><rect x="705" y="605" width="300" height="121" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="855" y="621">Accepting fills the form on that screen,</text><text x="855" y="635">and the app then saves it like any other</text><text x="855" y="649">entry.</text></g></g></g></g><g data-cell-id="r7"><g transform="translate(0.5,0.5)"><rect x="375" y="578" width="300" height="150" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" stroke-dasharray="6 4" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="525" y="604">Queued steps</text></g></g><g data-cell-id="r7_s"><g><rect x="375" y="605" width="300" height="121" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="525" y="621">A step that finished while the app was</text><text x="525" y="635">closed or offline comes back as a proposal</text><text x="525" y="649">and is checked exactly like a live one.</text></g></g></g></g><g data-cell-id="title"><g><rect x="35" y="24" width="1360" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(28, 25, 23);"><text x="35" y="49">AI blocks inside generated apps: verified at build, proposed at run</text></g></g></g><g data-cell-id="source"><g><rect x="35" y="56" width="1360" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="35" y="70">Source: src/core/pipeline/verify-blocks.ts, core/tasks/ai-block-service.ts, runtime/engine/dispatch.ts (runAIBlockFlow), docs/07 §13</text></g></g></g><g data-cell-id="lg0"><g transform="translate(0.5,0.5)"><path d="M 25 794 L 51 794" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="lg0t"><g><rect x="57" y="785" width="65" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="57" y="799">Main path</text></g></g></g><g data-cell-id="lg1"><g transform="translate(0.5,0.5)"><rect x="140" y="786" width="22" height="16" rx="2" ry="2" fill="#f2a541" stroke="#c77d0e" pointer-events="all" style="fill: rgb(242, 165, 65); stroke: rgb(199, 125, 14);"/></g></g><g data-cell-id="lg1t"><g><rect x="168" y="785" width="65" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="168" y="799">On device</text></g></g></g><g data-cell-id="lg2"><g transform="translate(0.5,0.5)"><rect x="251" y="786" width="22" height="16" rx="2" ry="2" fill="#1c1917" stroke="#1c1917" pointer-events="all" style="fill: rgb(28, 25, 23); stroke: rgb(28, 25, 23);"/></g></g><g data-cell-id="lg2t"><g><rect x="279" y="785" width="97" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="279" y="799">Firebase cloud</text></g></g></g><g data-cell-id="lg3"><g transform="translate(0.5,0.5)"><rect x="394" y="786" width="22" height="16" rx="2" ry="2" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g></g><g data-cell-id="lg3t"><g><rect x="422" y="785" width="104" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="422" y="799">Code in the app</text></g></g></g><g data-cell-id="edge0"><g transform="translate(0.5,0.5)"><path d="M 295 203 L 303.7 203" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 312.2 203 L 303.7 207.25 L 303.7 198.75 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge1"><g transform="translate(0.5,0.5)"><path d="M 565 203 L 573.71 203" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 582.21 203 L 573.71 207.25 L 573.71 198.75 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge2"><g transform="translate(0.5,0.5)"><path d="M 835 203 L 843.71 203" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 852.21 203 L 843.71 207.25 L 843.71 198.75 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge3"><g transform="translate(0.5,0.5)"><path d="M 1105 203 L 1113.7 203" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 1122.2 203 L 1113.7 207.25 L 1113.7 198.75 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge4"><g transform="translate(0.5,0.5)"><path d="M 345 443 L 363.7 443" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 372.2 443 L 363.7 447.25 L 363.7 438.75 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge5"><g transform="translate(0.5,0.5)"><path d="M 675 443 L 693.71 443" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 702.21 443 L 693.71 447.25 L 693.71 438.75 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge6"><g transform="translate(0.5,0.5)"><path d="M 1005 443 L 1023.7 443" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 1032.2 443 L 1023.7 447.25 L 1023.7 438.75 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge7"><g transform="translate(0.5,0.5)"><path d="M 1185 518 L 1185 566.71" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 1185 575.21 L 1180.75 566.71 L 1189.25 566.71 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge8"><g transform="translate(0.5,0.5)"><path d="M 1035 653 L 1016.29 653" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 1007.79 653 L 1016.29 648.75 L 1016.29 657.25 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge9"><g><path d="M 675 653 L 695.82 653" fill="none" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="9 6" pointer-events="stroke" style="stroke: rgb(87, 83, 78);"/><path d="M 703.32 653 L 695.82 656.75 L 695.82 649.25 Z" fill="#57534e" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(87, 83, 78); stroke: rgb(87, 83, 78);"/></g></g></g></g></g></svg>