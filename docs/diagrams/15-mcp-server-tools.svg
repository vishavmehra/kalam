<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FAF7F2; background-color: #FAF7F2; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1456px" height="897px" viewBox="0 0 1456 897"><defs/><rect fill="#FAF7F2" width="100%" height="100%" x="0" y="0" style="fill: rgb(250, 247, 242);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="srv"><g transform="translate(0.5,0.5)"><rect x="285" y="96" width="730" height="700" rx="5" ry="5" fill="#f3eee6" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(243, 238, 230); stroke: rgb(214, 211, 209);"/></g><g><g fill="#57534E" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="299" y="120">kalam-mcp (Node 20 or newer, one esbuild bundle)</text></g></g></g><g data-cell-id="ga"><g transform="translate(0.5,0.5)"><rect x="305" y="136" width="690" height="290" rx="5" ry="5" fill="#faf7f2" stroke="#d6d3d1" stroke-dasharray="6 4" pointer-events="all" style="fill: rgb(250, 247, 242); stroke: rgb(214, 211, 209);"/></g><g><g fill="#57534E" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="319" y="160">ALWAYS ON: 11 TOOLS, NO FILES, NO NETWORK, NO MODEL</text></g></g></g><g data-cell-id="host"><g transform="translate(0.5,0.5)"><rect x="25" y="136" width="210" height="100" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" stroke-dasharray="6 4" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="130" y="162">MCP host</text></g></g><g data-cell-id="host_s"><g><rect x="25" y="163" width="210" height="71" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="130" y="179">Claude Desktop, Claude Code</text><text x="130" y="193">or any MCP host.</text></g></g></g></g><g data-cell-id="tr"><g transform="translate(0.5,0.5)"><rect x="25" y="296" width="210" height="250" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="130" y="322">Transport</text></g></g><g data-cell-id="tr_s"><g><rect x="25" y="323" width="210" height="221" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="130" y="339">Stdio by default: stdout</text><text x="130" y="353">carries the protocol, logs</text><text x="130" y="367">go to stderr.</text><text x="130" y="395">--http [--port 3917]:</text><text x="130" y="409">Streamable HTTP on 127.0.0.1</text><text x="130" y="423">only. No login, so it cannot</text><text x="130" y="437">be combined with --workspace</text><text x="130" y="451">or --firebase. Host and</text><text x="130" y="465">Origin checks stop DNS</text><text x="130" y="479">rebinding.</text></g></g></g></g><g data-cell-id="t0"><g transform="translate(0.5,0.5)"><rect x="325" y="178" width="320" height="32" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><text x="485" y="199">kalam_spec_schema</text></g></g></g><g data-cell-id="t1"><g transform="translate(0.5,0.5)"><rect x="325" y="218" width="320" height="32" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><text x="485" y="239">kalam_validate_spec</text></g></g></g><g data-cell-id="t2"><g transform="translate(0.5,0.5)"><rect x="325" y="258" width="320" height="32" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><text x="485" y="279">kalam_list_templates</text></g></g></g><g data-cell-id="t3"><g transform="translate(0.5,0.5)"><rect x="325" y="298" width="320" height="32" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><text x="485" y="319">kalam_build_from_template</text></g></g></g><g data-cell-id="t4"><g transform="translate(0.5,0.5)"><rect x="325" y="338" width="320" height="32" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><text x="485" y="359">kalam_classify_request</text></g></g></g><g data-cell-id="t5"><g transform="translate(0.5,0.5)"><rect x="325" y="378" width="320" height="32" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><text x="485" y="399">kalam_explain_spec</text></g></g></g><g data-cell-id="t6"><g transform="translate(0.5,0.5)"><rect x="665" y="178" width="320" height="32" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><text x="825" y="199">kalam_diff_specs</text></g></g></g><g data-cell-id="t7"><g transform="translate(0.5,0.5)"><rect x="665" y="218" width="320" height="32" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><text x="825" y="239">kalam_check_formula</text></g></g></g><g data-cell-id="t8"><g transform="translate(0.5,0.5)"><rect x="665" y="258" width="320" height="32" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><text x="825" y="279">kalam_explain_formula</text></g></g></g><g data-cell-id="t9"><g transform="translate(0.5,0.5)"><rect x="665" y="298" width="320" height="32" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><text x="825" y="319">kalam_compute_report</text></g></g></g><g data-cell-id="t10"><g transform="translate(0.5,0.5)"><rect x="665" y="338" width="320" height="32" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><text x="825" y="359">kalam_package_app</text></g></g></g><g data-cell-id="ws"><g transform="translate(0.5,0.5)"><rect x="305" y="456" width="335" height="150" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="472.5" y="482">--workspace &lt;dir&gt;</text></g></g><g data-cell-id="ws_s"><g><rect x="305" y="483" width="335" height="121" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="472.5" y="499">kalam_workspace_list, kalam_workspace_read,</text><text x="472.5" y="513">kalam_workspace_write. Only *.kalam.json files</text><text x="472.5" y="527">directly inside that folder: no subfolders, no</text><text x="472.5" y="541">.., no absolute paths, no symlinks, size caps.</text></g></g></g></g><g data-cell-id="fb"><g transform="translate(0.5,0.5)"><rect x="660" y="456" width="335" height="150" rx="4" ry="4" fill="#1c1917" stroke="#1c1917" pointer-events="all" style="fill: rgb(28, 25, 23); stroke: rgb(28, 25, 23);"/></g><g><g fill="#FAF7F2" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(250, 247, 242);"><text x="827.5" y="482">--firebase</text></g></g><g data-cell-id="fb_s"><g><rect x="660" y="483" width="335" height="121" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#D6D3D1" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(214, 211, 209);"><text x="827.5" y="499">kalam_compile_with_firebase. Needs the Firebase</text><text x="827.5" y="513">variables and an App Check debug token. At most</text><text x="827.5" y="527">--cloud-calls model calls. Every call is a</text><text x="827.5" y="541">cloud call: Node has no device model.</text></g></g></g></g><g data-cell-id="res"><g transform="translate(0.5,0.5)"><rect x="305" y="636" width="690" height="140" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="650" y="662">Resources and prompt</text></g></g><g data-cell-id="res_s"><g><rect x="305" y="663" width="690" height="111" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="650" y="679">kalam://schema (JSON Schema), kalam://templates/{id}, kalam://docs/kalamspec.</text><text x="650" y="707">Prompt create_kalam_app: classify the request, use a template or write the spec, validate, fix with</text><text x="650" y="721">the repair hints, then package.</text></g></g></g></g><g data-cell-id="out"><g transform="translate(0.5,0.5)"><rect x="1075" y="136" width="330" height="170" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="1240" y="162">What comes out</text></g></g><g data-cell-id="out_s"><g><rect x="1075" y="163" width="330" height="141" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="1240" y="179">An app file (*.kalam.json, a one-app backup)</text><text x="1240" y="193">and an Open in Kalam link: kalam://import#</text><text x="1240" y="207">followed by the gzip, base64url spec. The spec</text><text x="1240" y="221">rides in the URL fragment and never goes to a</text><text x="1240" y="235">server.</text></g></g></g></g><g data-cell-id="app"><g><rect x="1075" y="366" width="330" height="170" rx="4" ry="4" fill="#fbe4dd" stroke="#e2583e" stroke-width="2" pointer-events="all" style="fill: rgb(251, 228, 221); stroke: rgb(226, 88, 62);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="1240" y="392">Kalam app, /import</text></g></g><g data-cell-id="app_s"><g><rect x="1075" y="393" width="330" height="141" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="1240" y="409">Decodes with size caps, runs the full</text><text x="1240" y="423">validateSpec and shows a preview that keeps</text><text x="1240" y="437">data in memory. Nothing is saved until the</text><text x="1240" y="451">person chooses.</text></g></g></g></g><g data-cell-id="core"><g transform="translate(0.5,0.5)"><rect x="1075" y="596" width="330" height="180" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="1240" y="622">src/core, reused as is</text></g></g><g data-cell-id="core_s"><g><rect x="1075" y="623" width="330" height="151" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="1240" y="639">spec and validateSpec, templates, classifier,</text><text x="1240" y="653">formula engine, report engine, change</text><text x="1240" y="667">describer, import-link and the compiler (for</text><text x="1240" y="681">the Firebase tool). Nothing is reimplemented.</text></g></g></g></g><g data-cell-id="title"><g><rect x="35" y="24" width="1360" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(28, 25, 23);"><text x="35" y="49">MCP server: tools, resources and what comes out</text></g></g></g><g data-cell-id="source"><g><rect x="35" y="56" width="1360" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="35" y="70">Source: mcp/src (server, tools, workspace, firebase, http, config), mcp/README.md, docs/18_MCP_SERVER.md</text></g></g></g><g data-cell-id="lg0"><g transform="translate(0.5,0.5)"><path d="M 25 839 L 51 839" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="lg0t"><g><rect x="57" y="830" width="65" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="57" y="844">Main path</text></g></g></g><g data-cell-id="lg1"><g transform="translate(0.5,0.5)"><rect x="140" y="831" width="22" height="16" rx="2" ry="2" fill="#1c1917" stroke="#1c1917" pointer-events="all" style="fill: rgb(28, 25, 23); stroke: rgb(28, 25, 23);"/></g></g><g data-cell-id="lg1t"><g><rect x="168" y="830" width="130" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="168" y="844">Optional cloud tool</text></g></g></g><g data-cell-id="lg2"><g transform="translate(0.5,0.5)"><rect x="316" y="831" width="22" height="16" rx="2" ry="2" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g></g><g data-cell-id="lg2t"><g><rect x="344" y="830" width="71" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="344" y="844">Local code</text></g></g></g><g data-cell-id="edge0"><g transform="translate(0.5,0.5)"><path d