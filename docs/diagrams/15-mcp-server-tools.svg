x="1045" y="226.01">result</text></g></g></g><g data-cell-id="edge3"><g transform="translate(0.5,0.5)"><path d="M 1240 306 L 1240 354.7" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 1240 363.2 L 1235.75 354.7 L 1244.25 354.7 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><rect fill="#FAF7F2" stroke="none" x="1199" y="330" width="84" height="15" stroke-width="0" style="fill: rgb(250, 247, 242);"/><text x="1240" y="341">person opens it</text></g></g></g><g data-cell-id="edge4"><g><path d="M 1075 686 L 1024.18 686.03" fill="none" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="9 6" pointer-events="stroke" style="stroke: rgb(87, 83, 78);"/><path d="M 1016.68 686.03 L 1024.18 682.28 L 1024.18 689.78 Z" fill="#57534e" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(87, 83, 78); stroke: rgb(87, 83, 78);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><rect fill="#FAF7F2" stroke="none" x="1023" y="680" width="45" height="15" stroke-width="0" style="fill: rgb(250, 247, 242);"/><text x="1045" y="691.01">bundled</text></g></g></g></g></g></g></svg>