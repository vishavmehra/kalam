<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FAF7F2; background-color: #FAF7F2; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1458px" height="908px" viewBox="0 0 1458 908"><defs/><rect fill="#FAF7F2" width="100%" height="100%" x="0" y="0" style="fill: rgb(250, 247, 242);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="l1"><g transform="translate(0.5,0.5)"><rect x="139" y="106" width="830" height="84" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="554" y="132">App shell and features</text></g></g><g data-cell-id="l1_s"><g><rect x="139" y="133" width="830" height="55" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="554" y="149">src/app: Expo Router routes (shelf, create, app/[id], bazaar, account, settings, join, import).</text><text x="554" y="163">src/features: create, drawing, bazaar, collab, history, widgets, voice, reports and more.</text></g></g></g></g><g data-cell-id="l2"><g transform="translate(0.5,0.5)"><rect x="139" y="216" width="830" height="70" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="554" y="242">Runtime, design, i18n, state</text></g></g><g data-cell-id="l2_s"><g><rect x="139" y="243" width="830" height="41" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="554" y="259">src/runtime (KalamRuntime, engine, component registry), src/design, src/i18n (10 languages), src/state (Zustand stores).</text></g></g></g></g><g data-cell-id="l3"><g><rect x="139" y="312" width="830" height="70" rx="4" ry="4" fill="#fbe4dd" stroke="#e2583e" stroke-width="2" pointer-events="all" style="fill: rgb(251, 228, 221); stroke: rgb(226, 88, 62);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="554" y="338">Composition root</text></g></g><g data-cell-id="l3_s"><g><rect x="139" y="339" width="830" height="41" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="554" y="355">src/services/index.ts: getServices() builds the database, auth, orchestrator, pipeline, backup and Bazaar services. The only</text><text x="554" y="369">place that wires infrastructure to core.</text></g></g></g></g><g data-cell-id="l4"><g><rect x="139" y="410" width="830" height="122" rx="4" ry="4" fill="#fbe4dd" stroke="#e2583e" stroke-width="2" pointer-events="all" style="fill: rgb(251, 228, 221); stroke: rgb(226, 88, 62);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="554" y="436">src/core: pure TypeScript, no React, no SDK</text></g></g><g data-cell-id="l4_s"><g><rect x="139" y="437" width="830" height="93" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="554" y="453">spec, compiler, classifier, templates, pipeline, ai (routing, orchestrator, cache, limits), formula, edit, history,</text><text x="554" y="467">versioning, media, review, backup, bazaar, collab, account-sync, share, queue, widgets, import-link, limits, observability.</text><text x="554" y="481">Every other layer depends on it; it depends on ports only.</text></g></g></g></g><g data-cell-id="l5"><g transform="translate(0.5,0.5)"><rect x="139" y="564" width="830" height="84" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="554" y="590">src/infrastructure: adapters behind the ports</text></g></g><g data-cell-id="l5_s"><g><rect x="139" y="591" width="830" height="55" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="554" y="607">firebase (AI Logic, Auth, App Check, Firestore, Remote Config), storage (Dexie, expo-sqlite), platform (speech, TTS, media,</text><text x="554" y="621">network), bazaar, collab, account-sync, specialist, pwa. Metro picks .web, .native or .ios files.</text></g></g></g></g><g data-cell-id="web"><g transform="translate(0.5,0.5)"><rect x="139" y="706" width="260" height="120" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="269" y="732">Web (PWA)</text></g></g><g data-cell-id="web_s"><g><rect x="139" y="733" width="260" height="91" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="269" y="749">Expo web export on Firebase Hosting.</text><text x="269" y="763">IndexedDB (Dexie). Chrome Prompt API</text><text x="269" y="777">(Gemini Nano). reCAPTCHA Enterprise.</text><text x="269" y="791">Service worker.</text></g></g></g></g><g data-cell-id="and"><g transform="translate(0.5,0.5)"><rect x="424" y="706" width="260" height="120" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="554" y="732">Android</text></g></g><g data-cell-id="and_s"><g><rect x="424" y="733" width="260" height="91" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="554" y="749">expo-sqlite. kalam-nano (Kotlin):</text><text x="554" y="763">Gemini Nano via ML Kit Prompt API on</text><text x="554" y="777">AICore, Play Integrity. Home-screen</text><text x="554" y="791">widget.</text></g></g></g></g><g data-cell-id="ios"><g transform="translate(0.5,0.5)"><rect x="709" y="706" width="260" height="120" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="839" y="732">iOS</text></g></g><g data-cell-id="ios_s"><g><rect x="709" y="733" width="260" height="91" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="839" y="749">expo-sqlite. kalam-apple (Swift):</text><text x="839" y="763">Apple Foundation Models, App Attest.</text><text x="839" y="777">WidgetKit widget. Same JS as</text><text x="839" y="791">Android.</text></g></g></g></g><g data-cell-id="mcp"><g transform="translate(0.5,0.5)"><rect x="1059" y="410" width="340" height="122" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="1229" y="436">MCP server (mcp/)</text></g></g><g data-cell-id="mcp_s"><g><rect x="1059" y="437" width="340" height="93" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="1229" y="453">esbuild bundles the pure src/core code into one</text><text x="1229" y="467">Node file. Stdio by default, or Streamable HTTP</text><text x="1229" y="481">on 127.0.0.1. 11 deterministic tools; workspace</text><text x="1229" y="495">and Firebase tools are opt-in.</text></g></g></g></g><g data-cell-id="fbn"><g transform="translate(0.5,0.5)"><rect x="1059" y="564" width="340" height="84" rx="4" ry="4" fill="#1c1917" stroke="#1c1917" pointer-events="all" style="fill: rgb(28, 25, 23); stroke: rgb(28, 25, 23);"/></g><g><g fill="#FAF7F2" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(250, 247, 242);"><text x="1229" y="590">Cloud side</text></g></g><g data-cell-id="fbn_s"><g><rect x="1059" y="591" width="340" height="55" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#D6D3D1" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(214, 211, 209);"><text x="1229" y="607">Firebase AI Logic, Auth, Firestore (kalam),</text><text x="1229" y="621">Cloud Functions (kalam). See the system context.</text></g></g></g></g><g data-cell-id="title"><g><rect x="49" y="24" width="1360" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(28, 25, 23);"><text x="49" y="49">Platform architecture: one codebase, four targets</text></g></g></g><g data-cell-id="source"><g><rect x="49" y="56" width="1360" height="18" fill="none" stroke="none" poi