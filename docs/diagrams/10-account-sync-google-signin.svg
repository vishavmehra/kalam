<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FAF7F2; background-color: #FAF7F2; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1435px" height="940px" viewBox="0 0 1435 940"><defs/><rect fill="#FAF7F2" width="100%" height="100%" x="0" y="0" style="fill: rgb(250, 247, 242);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="l1"><g transform="translate(0.5,0.5)"><rect x="25" y="96" width="370" height="760" rx="5" ry="5" fill="#f3eee6" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(243, 238, 230); stroke: rgb(214, 211, 209);"/></g><g><g fill="#57534E" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="39" y="120">KALAM APP</text></g></g></g><g data-cell-id="l2"><g transform="translate(0.5,0.5)"><rect x="425" y="96" width="320" height="760" rx="5" ry="5" fill="#f3eee6" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(243, 238, 230); stroke: rgb(214, 211, 209);"/></g><g><g fill="#57534E" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="439" y="120">GOOGLE</text></g></g></g><g data-cell-id="l3"><g transform="translate(0.5,0.5)"><rect x="775" y="96" width="280" height="760" rx="5" ry="5" fill="#e8e4dd" stroke="#1c1917" stroke-dasharray="6 4" pointer-events="all" style="fill: rgb(232, 228, 221); stroke: rgb(28, 25, 23);"/></g><g><g fill="#57534E" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="789" y="120">FIREBASE AUTH</text></g></g></g><g data-cell-id="l4"><g transform="translate(0.5,0.5)"><rect x="1085" y="96" width="300" height="760" rx="5" ry="5" fill="#e8e4dd" stroke="#1c1917" stroke-dasharray="6 4" pointer-events="all" style="fill: rgb(232, 228, 221); stroke: rgb(28, 25, 23);"/></g><g><g fill="#57534E" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="1099" y="120">FIRESTORE, DATABASE kalam</text></g></g></g><g data-cell-id="s1"><g transform="translate(0.5,0.5)"><rect x="45" y="136" width="330" height="110" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="210" y="162">1  Continue with Google</text></g></g><g data-cell-id="s1_s"><g><rect x="45" y="163" width="330" height="81" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="210" y="179">Signing in is required to use Kalam (ADR-040).</text><text x="210" y="193">Email and password is the other way in.</text></g></g></g></g><g data-cell-id="s2"><g transform="translate(0.5,0.5)"><rect x="445" y="136" width="280" height="110" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="585" y="162">2  Google proves who you are</text></g></g><g data-cell-id="s2_s"><g><rect x="445" y="163" width="280" height="81" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="585" y="179">Web: a popup. Android and iOS: the</text><text x="585" y="193">native Google Sign-In SDK returns an ID</text><text x="585" y="207">token for Kalam's web OAuth client.</text></g></g></g></g><g data-cell-id="s3"><g transform="translate(0.5,0.5)"><rect x="795" y="136" width="240" height="110" rx="4" ry="4" fill="#1c1917" stroke="#1c1917" pointer-events="all" style="fill: rgb(28, 25, 23); stroke: rgb(28, 25, 23);"/></g><g><g fill="#FAF7F2" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(250, 247, 242);"><text x="915" y="162">3  signInWithCredential</text></g></g><g data-cell-id="s3_s"><g><rect x="795" y="163" width="240" height="81" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#D6D3D1" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(214, 211, 209);"><text x="915" y="179">Verifies the token. An anonymous</text><text x="915" y="193">session from an older build is</text><text x="915" y="207">linked, so its uid is kept.</text></g></g></g></g><g data-cell-id="s4"><g><rect x="45" y="296" width="330" height="70" rx="4" ry="4" fill="#fbe4dd" stroke="#e2583e" stroke-width="2" pointer-events="all" style="fill: rgb(251, 228, 221); stroke: rgb(226, 88, 62);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="210" y="322">4  Signed in</text></g></g><g data-cell-id="s4_s"><g><rect x="45" y="323" width="330" height="41" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="210" y="339">The saved session keeps working offline.</text></g></g></g></g><g data-cell-id="s5"><g transform="translate(0.5,0.5)"><rect x="45" y="416" width="330" height="80" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="210" y="442">5  Pick a sync choice</text></g></g><g data-cell-id="s5_s"><g><rect x="45" y="443" width="330" height="51" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="210" y="459">Off, apps, or apps and records. Chosen per</text><text x="210" y="473">device. Sync never blocks using an app.</text></g></g></g></g><g data-cell-id="s6"><g transform="translate(0.5,0.5)"><rect x="45" y="546" width="330" height="140" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="210" y="572">6  One sync pass</text></g></g><g data-cell-id="s6_s"><g><rect x="45" y="573" width="330" height="111" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="210" y="589">Pull what changed, then plan each app by</text><text x="210" y="603">comparing design hashes: upload, download,</text><text x="210" y="617">conflict or delete tombstone. If both sides</text><text x="210" y="631">changed, last writer wins and the losing design</text><text x="210" y="645">stays in the Time Machine.</text></g></g></g></g><g data-cell-id="s7"><g transform="translate(0.5,0.5)"><rect x="45" y="738" width="330" height="100" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="210" y="764">7  Back up records</text></g></g><g data-cell-id="s7_s"><g><rect x="45" y="765" width="330" height="71" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="210" y="781">Only for "apps and records". Encrypted on the</text><text x="210" y="795">device. The passphrase never leaves it.</text></g></g></g></g><g data-cell-id="f1"><g transform="translate(0.5,0.5)"><rect x="1105" y="506" width="260" height="90" rx="4" ry="4" fill="#1c1917" stroke="#1c1917" pointer-events="all" style="fill: rgb(28, 25, 23); stroke: rgb(28, 25, 23);"/></g><g><g fill="#FAF7F2" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(250, 247, 242);"><text x="1235" y="532">users/{uid}/apps/{appId}</text></g></g><g data-cell-id="f1_s"><g><rect x="1105" y="533" width="260" height="61" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#D6D3D1" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(214, 211, 209);"><text x="1235" y="549">Design only: gzip plus base64, up to</text><text x="1235" y="563">100 KB, name, icon, version, deleted</text><text x="1235" y="577">flag.</text></g></g></g></g><g data-cell-id="f2"><g transform="translate(0.5,0.5)"><rect x="1105" y="733" width="260" height="110" rx="4" ry="4" fill="#1c1917" stroke="#1c1917" pointer-events="all" style="fill: rgb(28, 25, 23); stroke: rgb(28, 25, 23);"/></g><g><g fill="#FAF7F2" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(250, 247, 242);"><text x="1235" y="759">users/{uid}/backups/records_*</text></g></g><g data-cell-id="f2_s"><g><rect x="1105" y="760" width="260" height="81" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#D6D3D1" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(214, 211, 209);"><text x="1235" y="776">AES-256-GCM chunks under 900 KB, at</text><text x="1235" y="790">most 40 parts.</text></g></g></g></g><g data-cell-id="f3"><g transform="translate(0.5,0.5)"><rect x="1105" y="618" width="260" height="70" rx="4" ry="4" fill="#1c1917" stroke="#1c1917" pointer-events="all" style="fill: rgb(28, 25, 23); stroke: rgb(28, 25, 23);"/></g><g><g fill="#FAF7F2" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(250, 247, 242);"><text x="1235" y="644">users/{uid}/account/records</text></g></g><g data-cell-id="f3_s"><g><rect x="1105" y="645" width="260" height="41" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#D6D3D1" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(214, 211, 209);"><text x="1235" y="661">Pointer to the newest complete</text><text x="1235" y="675">backup set.</text></g></g></g></g><g data-cell-id="title"><g><rect x="35" y="24" width="1340" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(28, 25, 23);"><text x="35" y="49">Account: Google sign-in and opt-in sync</text></g></g></g><g data-cell-id="source"><g><rect x="35" y="56" width="1340" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="35" y="70">Source: src/infrastructure/firebase (auth-core, auth.web, auth-google.native), src/core/account-sync (model, plan, engine, records), firestore.rules users/{uid}</text></g></g></g><g data-cell-id="rules"><g><rect x="1105" y="166" width="260" height="130" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="1105" y="182">firestore.rules: only the signed-in</text><text x="1105" y="196">owner can read or write these documents,</text><text x="1105" y="210">each write is shape-checked, and records</text><text x="1105" y="224">are ciphertext only. Sign-out keeps</text><text x="1105" y="238">everything on the device.</text></g></g></g><g data-cell-id="lg0"><g transform="translate(0.5,0.5)"><path d="M 25 882 L 51 882" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="lg0t"><g><rect x="57" y="873" width="84" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="57" y="887">Sign-in path</text></g></g></g><g data-cell-id="lg1"><g transform="translate(0.5,0.5)"><rect x="159" y="874" width="22" height="16" rx="2" ry="2" fill="#1c1917" stroke="#1c1917" pointer-events="all" style="fill: rgb(28, 25, 23); stroke: rgb(28, 25, 23);"/></g></g><g data-cell-id="lg1t"><g><rect x="187" y="873" width="39" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="187" y="887">Cloud</text></g></g></g><g data-cell-id="lg2"><g transform="translate(0.5,0.5)"><rect x="244" y="874" width="22" height="16" rx="2" ry="2" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g></g><g data-cell-id="lg2t"><g><rect x="272" y="873" width="65" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="272" y="887">On device</text></g></g></g><g data-cell-id="edge0"><g transform="translate(0.5,0.5)"><path d="M 375 191 L 433.7 191" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 442.2 191 L 433.7 195.25 L 433.7 186.75 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge1"><g transform="translate(0.5,0.5)"><path d="M 725 191 L 783.71 191" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 792.21 191 L 783.71 195.25 L 783.71 186.75 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge2"><g transform="translate(0.5,0.5)"><path d="M 915 246 L 915 327 Q 915 331 911 331 L 386.3 331" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 377.8 331 L 386.3 326.75 L 386.3 335.25 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><rect fill="#F3EEE6" stroke="none" x="646" y="317" width="84" height="30" stroke-width="0" style="fill: rgb(243, 238, 230);"/><text x="687" y="329">user and saved</text><text x="687" y="343">session</text></g></g></g><g data-cell-id="edge3"><g><path d="M 210 366 L 210 406.82" fill="none" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(87, 83, 78);"/><path d="M 210 414.32 L 206.25 406.82 L 213.75 406.82 Z" fill="#57534e" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(87, 83, 78); stroke: rgb(87, 83, 78);"/></g></g><g data-cell-id="edge4"><g><path d="M 210 496 L 210 536.82" fill="none" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(87, 83, 78);"/><path d="M 210 544.32 L 206.25 536.82 L 213.75 536.82 Z" fill="#57534e" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(87, 83, 78); stroke: rgb(87, 83, 78);"/></g></g><g data-cell-id="edge5"><g><path d="M 385.24 551 L 1094.76 551" fill="none" stroke="#1c1917" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(28, 25, 23);"/><path d="M 377.24 551 L 385.24 547 L 385.24 555 Z" fill="#1c1917" stroke="#1c1917" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(28, 25, 23); stroke: rgb(28, 25, 23);"/><path d="M 1102.76 551 L 1094.76 555 L 1094.76 547 Z" fill="#1c1917" stroke="#1c1917" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(28, 25, 23); stroke: rgb(28, 25, 23);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><rect fill="#F3EEE6" stroke="none" x="719" y="544" width="43" height="15" stroke-width="0" style="fill: rgb(243, 238, 230);"/><text x="740" y="556">designs</text></g></g></g><g data-cell-id="edge6"><g><path d="M 210 686 L 210 728.82" fill="none" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(87, 83, 78);"/><path d="M 210 736.32 L 206.25 728.82 L 213.75 728.82 Z" fill="#57534e" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(87, 83, 78); stroke: rgb(87, 83, 78);"/></g></g><g data-cell-id="edge7"><g><path d="M 375 788 L 1094.76 788" fill="none" stroke="#1c1917" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(28, 25, 23);"/><path d="M 1102.76 788 L 1094.76 792 L 1094.76 784 Z" fill="#1c1917" stroke="#1c1917" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(28, 25, 23); stroke: rgb(28, 25, 23);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><rect fill="#F3EEE6" stroke="none" x="714" y="782" width="54" height="15" stroke-width="0" style="fill: rgb(243, 238, 230);"/><text x="740" y="793">ciphertext</text></g></g></g><g data-cell-id="edge8"><g><path d="M 1235 733 L 1235 698.24" fill="none" stroke="#1c1917" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(28, 25, 23);"/><path d="M 1235 690.24 L 1239 698.24 L 1231 698.24 Z" fill="#1c1917" stroke="#1c1917" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(28, 25, 23); stroke: rgb(28, 25, 23);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><rect fill="#E8E4DD" stroke="none" x="1193" y="704" width="85" height="15" stroke-width="0" style="fill: rgb(232, 228, 221);"/><text x="1235" y="715">then the pointer</text></g></g></g></g></g></g></svg>