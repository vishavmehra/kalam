<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FAF7F2; background-color: #FAF7F2; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1575px" height="734px" viewBox="0 0 1575 734"><defs/><rect fill="#FAF7F2" width="100%" height="100%" x="0" y="0" style="fill: rgb(250, 247, 242);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="root"><g><rect x="25" y="102" width="1170" height="74" rx="4" ry="4" fill="#fbe4dd" stroke="#e2583e" stroke-width="2" pointer-events="all" style="fill: rgb(251, 228, 221); stroke: rgb(226, 88, 62);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="610" y="128">KalamSpec 1.1.0 (one JSON document, at most 100 KB)</text></g></g><g data-cell-id="root_s"><g><rect x="25" y="129" width="1170" height="45" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="610" y="145">id, schemaVersion, version, name, description, icon, lang, initialScreen. Rendered only after validateSpec accepts it. No script, no eval, no URLs that run.</text></g></g></g></g><g data-cell-id="screens"><g transform="translate(0.5,0.5)"><rect x="25" y="236" width="270" height="270" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="39" y="262">screens[] (1 to 8)</text></g></g><g data-cell-id="screens_s"><g><rect x="25" y="263" width="270" height="241" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="37" y="279">id, title, description</text><text x="37" y="293">form: the collection its inputs bind</text><text x="37" y="307">to</text><text x="37" y="321">children[]: components</text><text x="37" y="335">layout[]: row, grid, card groups</text><text x="37" y="349">(1.1)</text><text x="37" y="377">Components: text, heading, number,</text><text x="37" y="391">textInput, date, choice, toggle,</text><text x="37" y="405">counter, bigButton, list, stat,</text><text x="37" y="419">photo. New in 1.1: chart, timer,</text><text x="37" y="433">reminder, signature.</text></g></g></g></g><g data-cell-id="actions"><g transform="translate(0.5,0.5)"><rect x="325" y="236" width="270" height="270" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="339" y="262">actions{}</text></g></g><g data-cell-id="actions_s"><g><rect x="325" y="263" width="270" height="241" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="337" y="279">A finite set, interpreted by the</text><text x="337" y="293">engine:</text><text x="337" y="321">navigate, insert, update, delete,</text><text x="337" y="335">increment, decrement, reset, runAI,</text><text x="337" y="349">speak, feedback, clearForm.</text><text x="337" y="377">New in 1.1: compute (writes a formula</text><text x="337" y="391">result).</text><text x="337" y="419">intents{}: phrases that voice</text><text x="337" y="433">commands map to an action id.</text></g></g></g></g><g data-cell-id="ai"><g transform="translate(0.5,0.5)"><rect x="625" y="236" width="270" height="270" rx="4" ry="4" fill="#f2a541" stroke="#c77d0e" pointer-events="all" style="fill: rgb(242, 165, 65); stroke: rgb(199, 125, 14);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="639" y="262">aiBlocks{}</text></g></g><g data-cell-id="ai_s"><g><rect x="625" y="263" width="270" height="241" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#3B2A0A" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(59, 42, 10);"><text x="637" y="279">Four kinds: extractFromPhoto,</text><text x="637" y="293">classify, summarise, translate.</text><text x="637" y="321">Each has a prompt, verified</text><text x="637" y="335">(onDevice, cloudPreferred,</text><text x="637" y="349">unverified), fallback (cloud or none)</text><text x="637" y="363">and onError.</text><text x="637" y="391">Always start unverified. A model or</text><text x="637" y="405">an imported file cannot claim</text><text x="637" y="419">otherwise.</text></g></g></g></g><g data-cell-id="cols"><g transform="translate(0.5,0.5)"><rect x="925" y="236" width="270" height="270" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="939" y="262">collections{}</text></g></g><g data-cell-id="cols_s"><g><rect x="925" y="263" width="270" height="241" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="937" y="279">Record id to fields.</text><text x="937" y="307">Field types: text, number, date,</text><text x="937" y="321">boolean, enum, image.</text><text x="937" y="349">ref: a field can link to an entry of</text><text x="937" y="363">another collection, with onDelete</text><text x="937" y="377">restrict, cascade or clear (1.1).</text><text x="937" y="405">At most 10 collections.</text></g></g></g></g><g data-cell-id="other"><g transform="translate(0.5,0.5)"><rect x="1245" y="236" width="280" height="270" rx="4" ry="4" fill="#f3eee6" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(243, 238, 230); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="1259" y="262">Other sections</text></g></g><g data-cell-id="other_s"><g><rect x="1245" y="263" width="280" height="241" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="1257" y="279">theme: colours, radius, fontScale,</text><text x="1257" y="293">spacing, fontFamily</text><text x="1257" y="321">meta: author, dates, source (template,</text><text x="1257" y="335">compiler, import, remix, manual),</text><text x="1257" y="349">license, generator</text><text x="1257" y="377">Optional in 1.1: permissions (camera,</text><text x="1257" y="391">notifications), accessibility, settings</text><text x="1257" y="405">(currency, time format), localization</text><text x="1257" y="419">(terminology).</text></g></g></g></g><g data-cell-id="title"><g><rect x="25" y="24" width="1500" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(28, 25, 23);"><text x="25" y="49">KalamSpec 1.1: an app is data, never code</text></g></g></g><g data-cell-id="source"><g><rect x="25" y="56" width="1500" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="25" y="70">Source: src/core/spec/schema.ts (SCHEMA_VERSION 1.1.0), limits/policy.ts, docs/05_KALAMSPEC.md</text></g></g></g><g data-cell-id="note"><g><rect x="25" y="634" width="700" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="25" y="642">Dashed lines are references the validator checks: every id must exist, every input field must match its</text><text x="25" y="656">collection field type.</text></g></g></g><g data-cell-id="lg0"><g transform="translate(0.5,0.5)"><path d="M 25 676 L 51 676" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="lg0t"><g><rect x="57" y="667" width="65" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="57" y="681">Structure</text></g></g></g><g data-cell-id="lg1"><g transform="translate(0.5,0.5)"><rect x="140" y="668" width="22" height="16" rx="2" ry="2" fill="#f2a541" stroke="#c77d0e" pointer-events="all" style="fill: rgb(242, 165, 65); stroke: rgb(199, 125, 14);"/></g></g><g data-cell-id="lg1t"><g><rect x="168" y="667" width="149" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="168" y="681">AI step (device first)</text></g></g></g><g data-cell-id="lg2"><g transform="translate(0.5,0.5)"><rect x="335" y="668" width="22" height="16" rx="2" ry="2" fill="#f3eee6" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(243, 238, 230); stroke: rgb(214, 211, 209);"/></g></g><g data-cell-id="lg2t"><g><rect x="363" y="667" width="168" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="363" y="681">Presentation and metadata</text></g></g></g><g data-cell-id="edge0"><g transform="translate(0.5,0.5)"><path d="M 160.02 176 L 160 224.71" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 160 233.21 L 155.75 224.7 L 164.25 224.71 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge1"><g transform="translate(0.5,0.5)"><path d="M 460.01 176 L 460 224.71" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 460 233.21 L 455.75 224.7 L 464.25 224.71 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge2"><g transform="translate(0.5,0.5)"><path d="M 759.99 176 L 760 224.71" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 760 233.21 L 755.75 224.71 L 764.25 224.7 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge3"><g transform="translate(0.5,0.5)"><path d="M 1059.98 176 L 1060 224.71" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 1060 233.21 L 1055.75 224.71 L 1064.25 224.7 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge4"><g transform="translate(0.5,0.5)"><path d="M 1195 139 L 1381 139 Q 1385 139 1385 143 L 1385 224.71" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 1385 233.21 L 1380.75 224.71 L 1389.25 224.71 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge5"><g><path d="M 241 506 L 241 534 Q 241 538 245 538 L 375 538 Q 379 538 379 534 L 379 515.18" fill="none" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="9 6" pointer-events="stroke" style="stroke: rgb(87, 83, 78);"/><path d="M 379 507.68 L 382.75 515.18 L 375.25 515.18 Z" fill="#57534e" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(87, 83, 78); stroke: rgb(87, 83, 78);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><rect fill="#FAF7F2" stroke="none" x="267" y="532" width="88" height="15" stroke-width="0" style="fill: rgb(250, 247, 242);"/><text x="310" y="543">bigButton.action</text></g></g></g><g data-cell-id="edge6"><g><path d="M 541 506 L 541 534 Q 541 538 545 538 L 675 538 Q 679 538 679 534 L 679 515.18" fill="none" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="9 6" pointer-events="stroke" style="stroke: rgb(87, 83, 78);"/><path d="M 679 507.68 L 682.75 515.18 L 675.25 515.18 Z" fill="#57534e" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(87, 83, 78); stroke: rgb(87, 83, 78);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><rect fill="#FAF7F2" stroke="none" x="574" y="532" width="73" height="15" stroke-width="0" style="fill: rgb(250, 247, 242);"/><text x="610" y="543">runAI.aiBlock</text></g></g></g><g data-cell-id="edge7"><g><path d="M 841 506 L 841 534 Q 841 538 845 538 L 975 538 Q 979 538 979 534 L 979 515.18" fill="none" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="9 6" pointer-events="stroke" style="stroke: rgb(87, 83, 78);"/><path d="M 979 507.68 L 982.75 515.18 L 975.25 515.18 Z" fill="#57534e" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(87, 83, 78); stroke: rgb(87, 83, 78);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><rect fill="#FAF7F2" stroke="none" x="875" y="532" width="72" height="15" stroke-width="0" style="fill: rgb(250, 247, 242);"/><text x="910" y="543">extract target</text></g></g></g><g data-cell-id="edge8"><g><path d="M 460 506 L 460 566 Q 460 570 464 570 L 1056 570 Q 1060 570 1060 566 L 1060 515.18" fill="none" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="9 6" pointer-events="stroke" style="stroke: rgb(87, 83, 78);"/><path d="M 1060 507.68 L 1063.75 515.18 L 1056.25 515.18 Z" fill="#57534e" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(87, 83, 78); stroke: rgb(87, 83, 78);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><rect fill="#FAF7F2" stroke="none" x="668" y="564" width="114" height="15" stroke-width="0" style="fill: rgb(250, 247, 242);"/><text x="724" y="575">insert, update, delete</text></g></g></g><g data-cell-id="edge9"><g><path d="M 106 506 L 106 598 Q 106 602 110 602 L 1137 602 Q 1141 602 1141 598 L 1141 515.18" fill="none" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="9 6" pointer-events="stroke" style="stroke: rgb(87, 83, 78);"/><path d="M 1141 507.68 L 1144.75 515.18 L 1137.25 515.18 Z" fill="#57534e" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(87, 83, 78); stroke: rgb(87, 83, 78);"/></g><g><g fill="#1C1917" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(28, 25, 23);"><rect fill="#FAF7F2" stroke="none" x="413" y="596" width="177" height="15" stroke-width="0" style="fill: rgb(250, 247, 242);"/><text x="501" y="607">form, list.collection, field bindings</text></g></g></g></g></g></g></svg>