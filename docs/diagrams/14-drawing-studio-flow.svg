<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FAF7F2; background-color: #FAF7F2; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1456px" height="852px" viewBox="0 0 1456 852"><defs/><rect fill="#FAF7F2" width="100%" height="100%" x="0" y="0" style="fill: rgb(250, 247, 242);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="d1"><g transform="translate(0.5,0.5)"><rect x="25" y="106" width="300" height="230" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="175" y="132">Canvas</text></g></g><g data-cell-id="d1_s"><g><rect x="25" y="133" width="300" height="201" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="175" y="149">Web: HTML Canvas 2D with pen pressure,</text><text x="175" y="163">wheel and pinch zoom. Android and iOS:</text><text x="175" y="177">Skia pictures with gesture handling; two</text><text x="175" y="191">fingers cancel a stroke.</text><text x="175" y="219">Tools: pen, marker, highlighter,</text><text x="175" y="233">rectangle, ellipse, line, arrow, text,</text><text x="175" y="247">component stamps, photo, eraser, select,</text><text x="175" y="261">group.</text></g></g></g></g><g data-cell-id="d2"><g><rect x="375" y="106" width="480" height="230" rx="4" ry="4" fill="#fbe4dd" stroke="#e2583e" stroke-width="2" pointer-events="all" style="fill: rgb(251, 228, 221); stroke: rgb(226, 88, 62);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="615" y="132">Drawing document</text></g></g><g data-cell-id="d2_s"><g><rect x="375" y="133" width="480" height="201" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="615" y="149">Immutable pages: up to 8 screens, each 400 by 800, up to 500 objects.</text><text x="615" y="177">Stamps (button, list, text input, heading, stat, photo, toggle) give</text><text x="615" y="191">the compiler structure. Objects can carry hints: header, nav, total,</text><text x="615" y="205">list item.</text><text x="615" y="233">Snapshot history makes undo and redo exact.</text></g></g></g></g><g data-cell-id="d3"><g transform="translate(0.5,0.5)"><rect x="905" y="106" width="240" height="230" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="1025" y="132">Autosave</text></g></g><g data-cell-id="d3_s"><g><rect x="905" y="133" width="240" height="201" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="1025" y="149">Edits are debounced. One write at</text><text x="1025" y="163">a time. A failed write is retried</text><text x="1025" y="177">with a growing delay. Flushed</text><text x="1025" y="191">when the app goes to the</text><text x="1025" y="205">background or the studio closes.</text></g></g></g></g><g data-cell-id="d4"><g transform="translate(0.5,0.5)"><rect x="1195" y="106" width="210" height="230" rx="4" ry="4" fill="#f2a541" stroke="#c77d0e" pointer-events="all" style="fill: rgb(242, 165, 65); stroke: rgb(199, 125, 14);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="1300" y="132">Local database</text></g></g><g data-cell-id="d4_s"><g><rect x="1195" y="133" width="210" height="201" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#3B2A0A" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(59, 42, 10);"><text x="1300" y="149">The drawings table. Every</text><text x="1300" y="163">load goes through</text><text x="1300" y="177">migrateDrawing, which</text><text x="1300" y="191">rebuilds the drawing field</text><text x="1300" y="205">by field and drops what it</text><text x="1300" y="219">cannot trust.</text></g></g></g></g><g data-cell-id="e1"><g transform="translate(0.5,0.5)"><rect x="25" y="426" width="380" height="190" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="215" y="452">Export and import</text></g></g><g data-cell-id="e1_s"><g><rect x="25" y="453" width="380" height="161" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="215" y="469">Export: PNG, SVG, PDF (raster pages) and .kalamdraw,</text><text x="215" y="483">Kalam's own file.</text><text x="215" y="511">Import: SVG through a strict allowlist (no scripts,</text><text x="215" y="525">links, use, image or styles) and .kalamdraw rebuilt</text><text x="215" y="539">field by field. An import always makes a NEW drawing.</text></g></g></g></g><g data-cell-id="e2"><g transform="translate(0.5,0.5)"><rect x="425" y="426" width="380" height="190" rx="4" ry="4" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="615" y="452">Handwriting to text</text></g></g><g data-cell-id="e2_s"><g><rect x="425" y="453" width="380" height="161" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="615" y="469">1  Handwritten digits are matched on the device, no</text><text x="615" y="483">model.</text><text x="615" y="497">2  Anything else goes to Gemini Nano on the device,</text><text x="615" y="511">only_on_device.</text><text x="615" y="525">3  Only if that fails, cloud is allowed and the person</text><text x="615" y="539">agrees: ONE cloud call.</text><text x="615" y="567">The person confirms the text before it replaces the</text><text x="615" y="581">strokes.</text></g></g></g></g><g data-cell-id="e3"><g><rect x="845" y="426" width="560" height="190" rx="4" ry="4" fill="#fbe4dd" stroke="#e2583e" stroke-width="2" pointer-events="all" style="fill: rgb(251, 228, 221); stroke: rgb(226, 88, 62);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="1125" y="452">Build an app from the drawing</text></g></g><g data-cell-id="e3_s"><g><rect x="845" y="453" width="560" height="161" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="1125" y="469">Stamps, text, shapes and hints become structure with no model. Arrows and repeated</text><text x="1125" y="483">rows become plain-sentence cues, and the person's own hints win.</text><text x="1125" y="511">Typed text is scanned on the device for card numbers, IDs, phones, emails and</text><text x="1125" y="525">secrets, and Kalam asks before anything goes to the cloud. Rasterised pages go to</text><text x="1125" y="539">cloud vision only if needed.</text></g></g></g></g><g data-cell-id="norm"><g><rect x="845" y="686" width="560" height="60" rx="15" ry="15" fill="#fbe4dd" stroke="#e2583e" stroke-width="2" pointer-events="all" style="fill: rgb(251, 228, 221); stroke: rgb(226, 88, 62);"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(28, 25, 23);"><text x="1125" y="721.5">NormalizedInput.drawing, then the creation pipeline</text></g></g></g><g data-cell-id="title"><g><rect x="35" y="24" width="1360" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1C1917" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(28, 25, 23);"><text x="35" y="49">Drawing Studio: from strokes to a built app</text></g></g></g><g data-cell-id="source"><g><rect x="35" y="56" width="1360" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="35" y="70">Source: src/features/drawing (canvas, model/*, autosave, handwriting-service, drawing-actions), docs/08</text></g></g></g><g data-cell-id="lg0"><g transform="translate(0.5,0.5)"><path d="M 25 794 L 51 794" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="lg0t"><g><rect x="57" y="785" width="65" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="57" y="799">Main path</text></g></g></g><g data-cell-id="lg1"><g transform="translate(0.5,0.5)"><rect x="140" y="786" width="22" height="16" rx="2" ry="2" fill="#f2a541" stroke="#c77d0e" pointer-events="all" style="fill: rgb(242, 165, 65); stroke: rgb(199, 125, 14);"/></g></g><g data-cell-id="lg1t"><g><rect x="168" y="785" width="65" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="168" y="799">On device</text></g></g></g><g data-cell-id="lg2"><g transform="translate(0.5,0.5)"><rect x="251" y="786" width="22" height="16" rx="2" ry="2" fill="#ffffff" stroke="#d6d3d1" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(214, 211, 209);"/></g></g><g data-cell-id="lg2t"><g><rect x="279" y="785" width="104" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57534E" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(87, 83, 78);"><text x="279" y="799">Code in the app</text></g></g></g><g data-cell-id="edge0"><g transform="translate(0.5,0.5)"><path d="M 325 221 L 363.7 221" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 372.2 221 L 363.7 225.25 L 363.7 216.75 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge1"><g><path d="M 855 221 L 895.82 221" fill="none" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(87, 83, 78);"/><path d="M 903.32 221 L 895.82 224.75 L 895.82 217.25 Z" fill="#57534e" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(87, 83, 78); stroke: rgb(87, 83, 78);"/></g></g><g data-cell-id="edge2"><g><path d="M 1145 221 L 1184.76 221" fill="none" stroke="#c77d0e" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(199, 125, 14);"/><path d="M 1192.76 221 L 1184.76 225 L 1184.76 217 Z" fill="#c77d0e" stroke="#c77d0e" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(199, 125, 14); stroke: rgb(199, 125, 14);"/></g></g><g data-cell-id="edge3"><g><path d="M 419.02 336 L 419 377 Q 419 381 415 381 L 219 381 Q 215 381 215 385 L 215 416.82" fill="none" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(87, 83, 78);"/><path d="M 215 424.32 L 211.25 416.82 L 218.75 416.82 Z" fill="#57534e" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(87, 83, 78); stroke: rgb(87, 83, 78);"/></g></g><g data-cell-id="edge4"><g><path d="M 615 336 L 615 416.82" fill="none" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(87, 83, 78);"/><path d="M 615 424.32 L 611.25 416.82 L 618.75 416.82 Z" fill="#57534e" stroke="#57534e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(87, 83, 78); stroke: rgb(87, 83, 78);"/></g></g><g data-cell-id="edge5"><g transform="translate(0.5,0.5)"><path d="M 807 336 L 807 377 Q 807 381 811 381 L 1121 381 Q 1125 381 1125 385 L 1125 414.7" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 1125 423.2 L 1120.75 414.7 L 1129.25 414.7 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g><g data-cell-id="edge6"><g transform="translate(0.5,0.5)"><path d="M 1125 616 L 1125 674.71" fill="none" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(226, 88, 62);"/><path d="M 1125 683.21 L 1120.75 674.71 L 1129.25 674.71 Z" fill="#e2583e" stroke="#e2583e" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(226, 88, 62); stroke: rgb(226, 88, 62);"/></g></g></g></g></g></svg>