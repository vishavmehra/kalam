# Release builds: the Android APK and the iOS builds, attached to a GitHub Release (README, "Download").
#
# Runs when a version tag is pushed (v0.1.0) or by hand with the tag to release. It builds these files and uploads them
# to one release, with a SHA-256 list so a download can be checked:
#   - Kalam-android.apk                     the release APK for phones: arm64-v8a only. Signed with the upload key kept
#                                           as repository secrets
#   - Kalam-android-x86_64.apk              the same app for x86_64 Android emulators, same key
#   - Kalam-ios-device-unsigned.ipa         the iPhone app with NO signature. A phone refuses it until it is signed:
#                                           sideload it with AltStore or Sideloadly (a free Apple ID works), or re-sign
#                                           it with an Apple Developer certificate. There is no way around this without
#                                           an Apple account.
#   - Kalam-ios-simulator.zip              the app for the iOS Simulator on a Mac (unzip, drag onto the Simulator).
#
# The Android and iOS-simulator steps are the ones CI already runs (android.yml, ci/mobile-smoke). The unsigned device IPA
# is the same build with the iphoneos SDK and no code signing. It has not run on a hosted runner yet, so the first run is
# the check: the job fails loudly if the .app or its JS bundle is missing.
#
# Secrets used: the three KALAM_ANDROID_KEYSTORE/KEY secrets (Android signing). The release is made with the run's own GITHUB_TOKEN, and the public Firebase web config comes from
# repository variables (the same ones android.yml reads).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v0.1.0 (created on the selected branch when it does not exist yet)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
  EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
  EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
  EXPO_PUBLIC_FIREBASE_ANDROID_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_ANDROID_APP_ID }}
  EXPO_PUBLIC_FIREBASE_IOS_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_IOS_APP_ID }}
  EXPO_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.EXPO_PUBLIC_RECAPTCHA_SITE_KEY }}
  EXPO_PUBLIC_AI_BACKEND: ${{ vars.EXPO_PUBLIC_AI_BACKEND }}
  EXPO_PUBLIC_AI_LOCATION: ${{ vars.EXPO_PUBLIC_AI_LOCATION }}
  EXPO_PUBLIC_SPECIALIST_ENABLED: 'false'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install --clean
      # One CPU type per APK keeps the download small (v1.0.0 carried all four: 194 MB). arm64-v8a is nearly every
      # phone and Apple silicon emulators; the second build, x86_64, is for emulators on Intel or AMD machines. R8 minify is already on (the prebuild template sets
      # android.enableMinifyInReleaseBuilds=true, and Mobile smoke runs that build). Resource shrinking stays off:
      # React Native loads bundled images by name at run time, which the shrinker cannot see, and an arm64 build
      # cannot be checked on the CI emulator.
      - name: Build the release APKs (arm64-v8a, then x86_64)
        working-directory: android
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          for abi in arm64-v8a x86_64; do
            ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=$abi
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/$abi.apk"
          done
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
      # Re-sign with the upload keystore kept in repository secrets (never in the repo). Expo prebuild signs the release
      # build with a debug key, so strip that signature, align, then sign with the real key.
      - name: Sign with the upload key and check the CPU types
        env:
          KS_B64: ${{ secrets.KALAM_ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KALAM_ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KALAM_ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::The upload keystore secrets are not set"; exit 1; fi
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          mkdir -p out
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          sign() { # <abi> <output name>
            in="$RUNNER_TEMP/apk/$1.apk"
            if [ ! -f "$in" ]; then echo "::error::No $1 APK was produced"; exit 1; fi
            abis=$(unzip -Z1 "$in" 'lib/*' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            if [ "$abis" != "$1 " ]; then echo "::error::$2 should hold only $1 code, found: $abis"; exit 1; fi
            zip -qd "$in" 'META-INF/*' || true
            "$bt/zipalign" -p -f 4 "$in" "$RUNNER_TEMP/aligned.apk"
            "$bt/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" --ks-key-alias "$KS_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:KS_PASS --out "out/$2" "$RUNNER_TEMP/aligned.apk"
            "$bt/apksigner" verify --print-certs "out/$2" | sed -n 1,2p
            echo "$2 ($1): $(stat -c %s "out/$2" | awk '{printf "%.1f", $1/1048576}') MB" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          sign arm64-v8a Kalam-android.apk
          sign x86_64 Kalam-android-x86_64.apk
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: out/*.apk
          retention-days: 7

  ios:
    name: iOS device (unsigned) and simulator
    # Apple silicon, Xcode 26.x. Expo SDK 58 needs Xcode 26.4 or later (the ci/mobile-smoke run used this image).
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # CI has no iOS Google client id, so the app offers email sign-in there anyway. Linking the GoogleSignIn pods also
      # breaks the Xcode 26 build ("redefinition of module 'RecaptchaInterop'"), so leave them out of this checkout.
      - name: Leave out native Google Sign-In on iOS
        run: |
          echo "module.exports = { dependencies: { '@react-native-google-signin/google-signin': { platforms: { ios: null } } } };" > react-native.config.js
          npm pkg set 'expo.autolinking.exclude[0]=@react-native-google-signin/google-signin'

      - name: Generate the native project
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build for the simulator
        run: |
          ws=$(ls -d ios/*.xcworkspace | head -n 1)
          scheme=$(basename "$ws" .xcworkspace)
          # The Expo module scan has a fixed 5 s limit and can miss it on a busy runner; a second build retries it.
          build() { xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Release -sdk iphonesimulator \
            -derivedDataPath ios/build-sim ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build; }
          build || build
          app=$(ls -d ios/build-sim/Build/Products/Release-iphonesimulator/*.app | head -n 1)
          if [ ! -f "$app/main.jsbundle" ]; then echo "::error::$app has no embedded JS bundle"; exit 1; fi
          mkdir -p out
          ditto -c -k --keepParent "$app" "out/Kalam-ios-simulator.zip"

      # No signature on purpose: signing needs an Apple Developer account, which CI does not hold.
      - name: Build for a device, unsigned
        continue-on-error: true
        run: |
          ws=$(ls -d ios/*.xcworkspace | head -n 1)
          scheme=$(basename "$ws" .xcworkspace)
          build() { xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Release -sdk iphoneos \
            -derivedDataPath ios/build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build; }
          build || build
          app=$(ls -d ios/build-device/Build/Products/Release-iphoneos/*.app | head -n 1)
          if [ ! -f "$app/main.jsbundle" ]; then echo "::error::$app has no embedded JS bundle"; exit 1; fi
          rm -rf Payload && mkdir Payload && cp -R "$app" Payload/
          zip -qry "out/Kalam-ios-device-unsigned.ipa" Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: |
            out/*.ipa
            out/*.zip
          retention-days: 7

  publish:
    name: Attach to the release
    needs: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files, nothing else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd out
          sha256sum Kalam-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > ../notes.md <<'NOTES'
          Kalam turns a typed idea, a photo of a sketch, your voice or a drawing into a working app that lives on your
          device and keeps working offline. It uses Firebase AI Logic for hybrid inference: deterministic templates first,
          Gemini Nano on the device where it is supported, and the cloud when a request needs it.

          Live web app (nothing to install): https://kalam-hybrid.web.app

          Android phone: download Kalam-android.apk (arm64-v8a, the CPU type of nearly every phone), open it on the
          phone and allow installs from unknown sources when asked. It is signed with an upload key, so it is a direct
          download and not a Play Store build. Android emulator on an Intel or AMD computer: use
          Kalam-android-x86_64.apk instead (an emulator on an Apple silicon Mac is arm64 and takes Kalam-android.apk).

          iOS Simulator (Mac with Xcode): unzip Kalam-ios-simulator.zip, boot a simulator, then run
          `xcrun simctl install booted Kalam.app` and `xcrun simctl launch booted com.kalam.app`.

          iPhone: a device build must be signed with an Apple Developer certificate, and CI has none. The .ipa here
          (if present) is unsigned: sign it with AltStore or Sideloadly (a free Apple ID works) or re-sign it yourself.
          It will not install as it is.

          Sign-in is required in the app (Google or email). Check a download against SHA256SUMS.txt.
          NOTES
          { echo; echo 'File sizes:'; ls -l Kalam-* | awk '{printf "- %s: %.1f MB\n", $9, $5/1048576}'; } >> ../notes.md
          cat ../notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "Kalam $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
