# Android build (docs/04 §22.2 and §22.4, docs/13 §13 and §20.2, docs/15 §11.8).
#
# Generates the native project with Expo prebuild, builds a release APK, reports its size against the 25 MB install
# target (docs/13 §17), and keeps the APK as a build artifact. Runs on main and on demand only: it is slow, and it
# does not need a secret. The release build is signed with the debug key that prebuild generates, so it is a test
# build, not a store build.
#
# Not covered here, and why:
#   - Android unit tests: the Expo stack has no Kotlin of its own to unit test (docs/16 ADR-038). Native module
#     tests will run here once a module exists.
#   - Emulator smoke tests and the device matrix (docs/13 §13): they need an emulator or a physical device with
#     hardware acceleration, which hosted Linux runners do not give reliably. Run them on a developer machine.
#   - On-device Gemini Nano on Android: needs a supported device. The APK is built, not exercised.
name: Android build

on:
  push:
    branches: [main]
    paths:
      - app.json
      - package.json
      - package-lock.json
      - src/**
      - modules/**
      - assets/**
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
  EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
  EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
  EXPO_PUBLIC_SPECIALIST_ENABLED: 'false'
  # Keeps /lab and /nano-check reachable in this test build (the Test Lab APK). A store build never sets it.
  EXPO_PUBLIC_DIAGNOSTICS: 'true'

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      # The home screen widget (modules/kalam-widget, docs/14 §18) is an Expo module that autolinking compiles into the
      # app. The build fails here when its receiver is not in the merged manifest, which means it was left out.
      - name: The widget is in the app
        run: |
          manifest=$(find android/app/build -path '*merged_manifests/release*' -name AndroidManifest.xml | head -n 1)
          if [ -z "$manifest" ]; then echo "::error::No merged manifest found"; exit 1; fi
          for name in expo.modules.kalamwidget.KalamWidgetProvider expo.modules.kalamwidget.WidgetPickerActivity; do
            grep -q "$name" "$manifest" || { echo "::error::$name is not in the app manifest"; exit 1; }
          done
          echo "The Kalam widget receiver and picker are in the app manifest."

      # Report only: a store build is smaller than this test build, and the target is the install size on a device.
      - name: APK size against the 25 MB target
        run: |
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then echo "::error::No APK was produced"; exit 1; fi
          bytes=$(stat -c %s "$apk")
          limit=26214400
          line="Release APK $(basename "$apk"): $((bytes / 1024 / 1024)) MB ($bytes bytes). Target: under 25 MB (docs/13 §17)."
          echo "$line"
          { echo '### Android APK size'; echo "$line"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt "$limit" ]; then echo "::warning::$line Over the target."; fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
