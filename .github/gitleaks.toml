# Secret scanning rules for Kalam (docs/16 R-031: a debug token or secret leaks).
# Built on gitleaks' default rules, plus the things this project must never commit.
title = "Kalam gitleaks rules"

[extend]
useDefault = true

[[rules]]
id = "kalam-appcheck-debug-token"
description = "A Firebase App Check debug token assigned to a variable or env entry. Keep it in .env.local, never in a commit."
regex = '''(?i)APPCHECK_DEBUG_TOKEN["']?\s*[:=]\s*["']?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
keywords = ["debug_token"]
tags = ["firebase", "app-check"]

[[rules]]
id = "kalam-anthropic-api-key"
description = "An Anthropic API key. Provider keys live only in Cloud Functions secrets, never in the repo or the client."
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-"]
tags = ["provider", "server-side-only"]

[[rules]]
id = "kalam-nebius-api-key"
description = "A Nebius Token Factory API key assigned in a file."
regex = '''(?i)NEBIUS[A-Z_]*KEY["']?\s*[:=]\s*["']?[A-Za-z0-9._-]{20,}'''
keywords = ["nebius"]
tags = ["provider", "server-side-only"]

[[allowlists]]
description = "Placeholders and documentation examples"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)\.firebaserc\.example$''',
  '''\.github/gitleaks\.toml$''',
]

# Reported by the scan on 2026-11-26 and checked by hand. Each entry names one file and the exact line shape, so a real
# secret added to the same file still fails the scan (both the path and the text have to match).
[[allowlists]]
description = "Fake App Check debug token in the MCP Firebase test"
condition = "AND"
paths = ['''^mcp/test/firebase\.test\.ts$''']
regexTarget = "line"
regexes = ['''EXPO_PUBLIC_APPCHECK_DEBUG_TOKEN: '11111111-2222-3333-4444-555555555555',''']

[[allowlists]]
description = "Storage key names in the Bazaar cache (the name of an AsyncStorage entry, not a secret)"
condition = "AND"
paths = ['''^src/infrastructure/bazaar/cache\.ts$''']
regexTarget = "line"
regexes = ['''const [A-Z_]+_KEY = 'kalam\.bazaar\.[a-z.]+\.v[0-9]+';''']

[[allowlists]]
description = "Sentinel text the data-minimisation test searches for in outgoing requests"
condition = "AND"
paths = ['''^tests/unit/data-minimisation\.test\.ts$''']
regexTarget = "line"
regexes = ['''const SECRET_TEXT = 'SENTINEL-secret-[0-9]+';''']
