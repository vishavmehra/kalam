plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.kalam'
version = '0.1.0'

android {
  namespace "expo.modules.kalamwidget"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

// No extra dependencies: the widget uses only the Android framework (AppWidgetProvider, RemoteViews, org.json).
